[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "productivity-agent"
version = "0.1.0"
description = "Personal Productivity Assistant - Google ADK agent on Amazon Bedrock AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "google-adk>=2.14.1,<3",
    "litellm>=1.110.0",
    "tzdata>=2026.6",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
